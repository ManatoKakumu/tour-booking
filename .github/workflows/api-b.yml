name: api-b

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/api-b/**"
  push:
    branches: [main]
    paths:
      - "apps/api-b/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ECR_REPOSITORY: api-b

jobs:
  build-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        run: |
          docker build -t ${{ env.ECR_REPOSITORY }}:${{ github.sha }} apps/api-b

  push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: api-b
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/api-b-ecr-push
          aws-region: ap-northeast-1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          docker build -t ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} apps/api-b
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition --task-definition api-b --query taskDefinition > task-definition.json

      - name: Render new task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: api-b
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: api-b
          cluster: tour-booking-b
          wait-for-service-stability: true

  create-db-user:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: api-b
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/api-b-ecr-push
          aws-region: ap-northeast-1

      - name: Run DB user setup task
        run: |
          NETWORK_CONFIG=$(aws ecs describe-services \
            --cluster tour-booking-b \
            --services api-b \
            --query 'services[0].networkConfiguration' \
            --output json)

          TASK_ARN=$(aws ecs run-task \
            --cluster tour-booking-b \
            --task-definition db-user-setup-b \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG" \
            --query 'tasks[0].taskArn' --output text)

          aws ecs wait tasks-stopped --cluster tour-booking-b --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster tour-booking-b \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "DB user setup task failed with exit code $EXIT_CODE"
            exit 1
          fi
