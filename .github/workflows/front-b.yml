name: front-b

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/front-b/**"
  push:
    branches: [main]
    paths:
      - "apps/front-b/**"

permissions:
  id-token: write
  contents: read

env:
  ECR_REPOSITORY: front-b

jobs:
  build-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        run: |
          docker build -t ${{ env.ECR_REPOSITORY }}:${{ github.sha }} apps/front-b

  push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: front-b
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/front-b-ecr-push
          aws-region: ap-northeast-1
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        run: |
          docker build -t ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} apps/front-b
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
