# CloudFrontのキャッシュビヘイビアとALBのリスナールールを再現する。
# nginxは最長一致のため、ALBの優先度順と結果が一致するようにパスを並べている

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 80;
  client_max_body_size 6m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  # ---- CloudFront: 静的配信用S3 ----
  location = / {
    root /usr/share/nginx/static;
    try_files /index.html =404;
  }
  location = /about {
    default_type "text/html; charset=utf-8";
    alias /usr/share/nginx/static/about.html;
  }
  location = /terms {
    default_type "text/html; charset=utf-8";
    alias /usr/share/nginx/static/terms.html;
  }
  # CloudFront: 画像用S3(images/*)はローカルでは再現しない
  location /images/ {
    return 404;
  }

  # ---- ALB: B側(Cognito B認証) ----
  location /b/api/ { proxy_pass http://api-b:3000; }
  location /b/     { proxy_pass http://front-b:3000; }

  # ---- ALB: C側 ----
  location /c/booking/api/ { proxy_pass http://api-c:3000; }
  location /c/mypage/api/  { proxy_pass http://api-c:3000; }
  location /api/           { proxy_pass http://api-c:3000; }
  # /c/booking/*・/c/mypage/*(Cognito C認証)とデフォルトルールはどちらもfront-c
  location /               { proxy_pass http://front-c:3000; }
}
